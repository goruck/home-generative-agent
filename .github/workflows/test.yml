name: "Test"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7"

        - name: "Set up Python"
          uses: actions/setup-python@v7.0.0
          with:
            python-version: "3.14"
            cache: "pip"
            cache-dependency-path: |
              requirements/test.txt
              requirements_runtime_manifest.txt

        # The runtime requirements are the manifest's pins, regenerated by
        # scripts/gen_manifest_requirements.py (make lint fails if stale), so
        # the suite runs against exactly what a fresh install resolves.
        - name: "Install requirements"
          run: |
            python3 -m pip install -r requirements/test.txt
            python3 -m pip install -r requirements_runtime_manifest.txt

        - name: "Show the SDK versions under test"
          run: python3 -m pip show anthropic langchain-anthropic langchain-core openai homeassistant | grep -E "^(Name|Version)"

        - name: "Test"
          run: PYTHONPATH="$PWD" python3 -m pytest

name: "Test"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7"

        - name: "Set up Python"
          uses: actions/setup-python@v7.1.0
          with:
            python-version: "3.14"
            cache: "pip"
            cache-dependency-path: |
              requirements/test.txt
              requirements_runtime_manifest.txt

        # The runtime requirements are the manifest's pins, regenerated by
        # scripts/gen_manifest_requirements.py (make lint fails if stale), so
        # the suite runs against exactly what a fresh install resolves.
        - name: "Install requirements"
          run: |
            python3 -m pip install -r requirements/test.txt
            python3 -m pip install -r requirements_runtime_manifest.txt

        - name: "Show the SDK versions under test"
          run: python3 -m pip show anthropic langchain-anthropic langchain-core openai homeassistant | grep -E "^(Name|Version)"

        - name: "Test"
          run: PYTHONPATH="$PWD" python3 -m pytest

  pyright:
    name: "Pyright"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7"

        - name: "Set up Python"
          uses: actions/setup-python@v7.1.0
          with:
            python-version: "3.14"
            cache: "pip"
            cache-dependency-path: |
              requirements/test.txt
              requirements/dev.txt
              requirements_runtime_manifest.txt

        # pyrightconfig.json reads the packages from the hga venv, as
        # `make typecheck` does locally. Test pins are included because the
        # type errors that matter come from the pinned Home Assistant (a test
        # pin bump to HA 2026.11 left typecheck red on main, #926).
        - name: "Install requirements into hga"
          run: |
            python3 -m venv hga
            hga/bin/pip install -r requirements/test.txt
            hga/bin/pip install -r requirements_runtime_manifest.txt
            hga/bin/pip install -r requirements/dev.txt

        - name: "Type check"
          run: hga/bin/pyright --stats

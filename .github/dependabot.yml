# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
    ignore:
      # These move with Home Assistant, by hand: the test pins must equal what
      # the tested HA version pins (its package_constraints.txt or a core
      # component's manifest), and the plugin requires one exact HA version.
      # The "HA compatibility" workflow (scripts/check_ha_versions.py) fails a
      # PR that lets them drift and names the versions to bump to.
      - dependency-name: "homeassistant"
      - dependency-name: "pytest-homeassistant-custom-component"
      - dependency-name: "openai"
      - dependency-name: "mutagen"
      - dependency-name: "ha-ffmpeg"
      - dependency-name: "zwave-js-server-python"
      - dependency-name: "async-upnp-client"
      - dependency-name: "getmac"
      - dependency-name: "PyTurboJPEG"
      - dependency-name: "pymicro-vad"
      - dependency-name: "pyspeex-noise"

